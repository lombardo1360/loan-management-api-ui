<h2>
  {{ userId ? 'Edit User' : 'Create User' }}
</h2>

<form
  [formGroup]="userForm"
  (ngSubmit)="saveUser()">

  <div>
    <label for="username">
      Username
    </label>

    <input
      id="username"
      type="text"
      formControlName="username">
  </div>

  <div>
    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      formControlName="password">
  </div>

  <div>
    <label for="role">
      Role
    </label>

    <select
      id="role"
      formControlName="role">

      <option value="ROLE_USER">
        User
      </option>

      <option value="ROLE_ADMIN">
        Admin
      </option>

    </select>
  </div>

  <button type="submit">
    {{ userId ? 'Update User' : 'Create User' }}
  </button>

</form>
