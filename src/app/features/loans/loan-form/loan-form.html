<h2>
  {{ loanId ? 'Edit Loan' : 'Create Loan' }}
</h2>

<form
  [formGroup]="loanForm"
  (ngSubmit)="saveLoan()">

  <div>
    <label for="clientId">
      Client ID
    </label>

    <input
      id="clientId"
      type="number"
      formControlName="clientId">
  </div>

  <div>
    <label for="amount">
      Amount
    </label>

    <input
      id="amount"
      type="number"
      formControlName="amount">
  </div>

  <div>
    <label for="interestRate">
      Interest Rate
    </label>

    <input
      id="interestRate"
      type="number"
      step="0.01"
      formControlName="interestRate">
  </div>

  <div>
    <label for="termInMonths">
      Term in months
    </label>

    <input
      id="termInMonths"
      type="number"
      formControlName="termInMonths">
  </div>

  <button type="submit">
    {{ loanId ? 'Update Loan' : 'Create Loan' }}
  </button>

</form>
